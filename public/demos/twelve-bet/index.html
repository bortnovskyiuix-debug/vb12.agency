<!DOCTYPE html>
<html lang="en" data-brand="12bet">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#03070D"/>
<title>12xBet Poker — Lobby</title>
<link rel="icon" href="brand/12bet/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="brand/12bet/apple-touch-icon.png"/>
<link rel="preload" as="image" href="brand/12bet/logo.svg"/>

<style>
@font-face{font-family:Montserrat;font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#03070D; --panel:#0A121F; --panel-2:#0E1828; --panel-3:#142034; --panel-4:#1A2A42;
  --line:#16233A; --line-2:#263A58;
  --text:#F2F5F9; --text-2:#C3CEDC; --mute:#7E8FA6; --dim:#55667D;
  --blue:#0098FE; --blue-h:#1FA5FF; --blue-d:#0B6FD1; --blue-soft:rgba(0,152,254,.12);
  --gold:#E9C987; --green:#2FCB7A; --red:#E8475B;
  --felt-0:#16527C; --felt-1:#0F3A5C; --felt-2:#0B2A44;
  --r:12px; --rs:8px;
  --side:272px; --head:68px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --tg-t:0px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;background:var(--bg)}
body::before{content:"";position:absolute;left:0;right:0;top:var(--head);height:1000px;z-index:-1;pointer-events:none;opacity:.2;
  background:
    radial-gradient(ellipse 50% 380px at 64% 40px, rgba(40,60,190,.22), transparent 70%),
    radial-gradient(ellipse 36% 340px at 24% 0px, rgba(60,50,180,.14), transparent 70%),
    linear-gradient(180deg, #121B40 0px, #0F1735 220px, #0A1026 440px, rgba(3,7,13,0) 820px)}
body{position:relative;isolation:isolate}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none}
.hide{display:none!important}

/* ── Header ─────────────────────────────── */
.hdr{position:sticky;top:0;z-index:40;height:var(--head);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.sq{width:40px;height:40px;border-radius:var(--rs);display:grid;place-items:center;background:transparent;color:var(--text-2);position:relative}
.sq:hover{background:var(--panel-3);color:var(--text)}
.sq.lang{width:auto;padding:0 12px;gap:8px;display:flex;font-weight:600;font-size:13px}
.sq .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel)}
.brandcell{display:flex;align-items:center;gap:6px;width:calc(var(--side) - 16px);flex:none}
.logo{display:block;margin:0 10px 0 4px}
.logo img{height:24px;display:block}
.sp{flex:1}
.user{display:flex;align-items:center;gap:10px;margin-right:4px}
.user img{width:40px;height:40px;border-radius:50%;background:#1B3550}
.user div{display:grid;line-height:1.3}
.user b{font-size:13px;font-weight:600}
.user small{font-size:11.5px;color:var(--mute)}
.bal{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;border-radius:var(--rs);background:var(--panel-2)}
.coin{width:20px;height:20px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#4A3610;font-weight:700;font-size:11px}
.bal b{font-size:14px;font-weight:600;min-width:64px}
.bal .chev{color:var(--mute);margin-right:2px}
.plus{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--blue)}
.plus:hover{background:var(--blue-h)}

/* ── Shell ──────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--head))}
.side{position:sticky;top:var(--head);height:calc(100vh - var(--head));overflow-y:auto;padding:14px 12px 16px;display:flex;flex-direction:column;gap:10px;background:transparent;border-right:1px solid rgba(120,170,255,.08);scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.srch{display:flex;align-items:center;gap:10px;height:44px;width:min(420px,40vw);margin-left:18px;padding:0 8px 0 14px;border-radius:10px;background:var(--panel);color:var(--mute)}
.srch:focus-within{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--text-2)}
.srch>svg{width:20px;height:20px;flex:none}
.srch input{all:unset;flex:1;min-width:0;height:100%;font-size:14.5px;font-weight:500;color:var(--text)}
.srch input::placeholder{color:var(--mute);font-weight:500}
.srch .clr{display:none;width:28px;height:28px;border-radius:8px;place-items:center;color:var(--mute);background:var(--panel-3)}
.srch .clr svg{width:16px;height:16px}
.srch.has .clr{display:grid}
.grp{display:grid;gap:2px;padding:6px;border-radius:14px;background:var(--panel)}
.grp a{display:flex;align-items:center;gap:14px;height:46px;padding:0 12px;border-radius:10px;color:var(--text);font-weight:600;font-size:14.5px}
.grp a .lb{flex:1}
.grp a:hover{background:var(--panel-3)}
.grp a svg{color:var(--mute);width:22px;height:22px}
.grp a .ch{width:18px;height:18px;color:var(--dim)}
.grp a.on{background:var(--panel-3)}
.grp a.on svg:not(.ch){color:var(--blue)}
.grp a .s,.tabbar a .s{display:none}
.grp a.on .o,.tabbar a.on .o{display:none}
.grp a.on .s,.tabbar a.on .s{display:block}
.grp a .soon{font-size:11px;font-weight:500;color:var(--dim)}
.main{min-width:0;padding:12px 28px 56px}
.view{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
html,body{overflow-x:clip}
.view>.sec-h:not(:first-child){margin-top:16px}

/* ── Common ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--rs);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn-blue{color:#fff;background:var(--blue)}
.btn-blue:hover{background:var(--blue-h)}
.btn-dark{background:var(--panel-3);color:var(--text)}
.btn-dark:hover{background:var(--panel-4)}
.ibtn{width:38px;height:38px;border-radius:var(--rs);display:grid;place-items:center;background:var(--panel-3);color:var(--text-2)}
.ibtn:hover{background:var(--panel-4);color:var(--text)}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec-h h2 .hi{width:22px;height:22px;color:var(--blue);flex:none}
.welcome h1{margin:0;font-size:20px;font-weight:600}
.welcome p{margin:4px 0 0;color:var(--mute);font-size:13px}
.welcome p b{color:var(--green);font-weight:600}
.ev{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-2);font-size:13px}

/* Carousel */
.car{position:relative}
.car-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 28px) / 3);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r)}
.car-track::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--panel);display:block;position:relative}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.car-arrow{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(12,24,41,.85);color:#fff;z-index:2}
.car-arrow.l{left:10px}.car-arrow.r{right:10px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:0}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--dim);transition:width .25s;cursor:pointer}
.dots i.on{width:36px;background:var(--text-2)}

/* Tournament cards */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tcard{border-radius:var(--r);overflow:hidden;background:var(--panel);display:flex;flex-direction:column;transition:background-color .2s}
.tcard:hover{background:var(--panel-2)}
.tart{position:relative;aspect-ratio:1.85/1;overflow:hidden;background:#0A1526}
.tart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,right center)}
.tart{--tint:#0C1F3A}.tart.gold{--tint:#2A2414}.tart.tart::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tint) 30%,color-mix(in srgb,var(--tint) 45%,transparent) 62%,transparent 85%)}
.tart>*:not(img){z-index:1}
.cd{position:absolute;top:10px;right:10px;padding:5px 9px;border-radius:6px;background:rgba(7,15,28,.78);font-size:12px;color:var(--text-2)}
.cd b{color:var(--text);font-weight:600;margin-left:4px}
.cd.live b{color:var(--green)}
.tart .kind{display:none}
.tart .gtd{position:absolute;left:14px;bottom:12px;display:grid;line-height:1.1}
.tart .gtd small{font-size:11.5px;color:var(--text-2);margin-bottom:3px}
.tart .gtd b{font-size:26px;font-weight:700;color:var(--gold)}
.tbody{padding:12px 14px 14px;display:grid;gap:7px}
.tbody h3{margin:0 0 2px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px}
.kv svg{width:16px;height:16px;color:var(--dim)}
.kv .v{margin-left:auto;color:var(--text);font-weight:600}
.kv .v.g{color:var(--gold)}

/* Notice + jackpot strip */
.notice{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;padding:0 16px;border-radius:var(--rs);background:var(--panel);color:var(--text-2);font-size:13px;overflow:hidden}
.notice svg{color:var(--green);flex:none;width:16px;height:16px}
.notice span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.notice span.out{opacity:0}
.notice em{font-style:normal;color:var(--blue);font-weight:600}
.notice strong{color:var(--text);font-weight:600}
.jstrip{position:relative;height:112px;border-radius:var(--r);overflow:hidden;background:#0C2242;display:flex;align-items:center;padding:0 28px;gap:16px}
.jstrip img{position:absolute;right:56px;bottom:-62%;height:190%;width:auto}
.jstrip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0C2242 36%,rgba(12,34,66,0) 62%)}
.jstrip .t{position:relative;z-index:1;display:grid;line-height:1.1}
.jstrip .t small{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em;margin-bottom:4px}
.jstrip .t b{font-size:34px;font-weight:700;color:var(--gold)}
.jstrip .t i{display:none}

/* Filters row */
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:3px;border-radius:var(--rs);background:var(--panel-2)}
.tabs button{height:38px;padding:0 20px;border-radius:6px;color:var(--mute);font-weight:600;font-size:14px}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--panel-4);color:var(--text)}
.chk{white-space:nowrap;display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;border-radius:var(--rs);background:var(--panel-2);color:var(--text-2);font-size:13px;cursor:pointer;user-select:none}
.chk input{appearance:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);margin:0;display:grid;place-items:center;cursor:pointer}
.chk input:checked{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 42%,transparent 48%)}
.vt{display:flex;gap:2px;padding:3px;border-radius:var(--rs);background:var(--panel-2)}
.vt button{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;color:var(--mute)}
.vt button.on{background:var(--panel-4);color:var(--text)}

/* Stake section */
.stake{display:grid;gap:12px}
.stake-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stake-h h3{margin:0;font-size:17px;font-weight:600}
.stake-h .meta{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.stake-h .meta b{color:var(--text-2);font-weight:600}
.stake-h .meta i{width:1px;height:14px;background:var(--line-2)}
.stake-h .meta svg{width:16px;height:16px}
.tables{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 28px) / 3);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.tables::-webkit-scrollbar{display:none}
.tables.grid{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}

/* Mini table card */
.mt{scroll-snap-align:start;position:relative;aspect-ratio:1.4/1;border-radius:var(--r);background:var(--panel);overflow:hidden;cursor:pointer;transition:background-color .2s}
.mt:hover{background:var(--panel-2)}
.mt .oval{position:absolute;left:14%;right:14%;top:27%;bottom:13%;border-radius:999px;background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--felt-0),var(--felt-1) 55%,var(--felt-2));box-shadow:0 0 0 6px var(--rail,#132C47),0 0 0 7px #0A1526}
.mt.f-blue{--felt-0:#1C5E8F;--felt-1:#124169;--felt-2:#0B2A47;--rail:#132C47}
.mt.f-green{--felt-0:#1F7A55;--felt-1:#145538;--felt-2:#0C3524;--rail:#12301F}
.mt.f-red{--felt-0:#8E2A34;--felt-1:#631C25;--felt-2:#3F1118;--rail:#33141A}
.mt .ctr{position:absolute;left:50%;top:61%;translate:-50% -50%;text-align:center;line-height:1.15;pointer-events:none}
.mt .ctr b{display:block;font-size:15px;font-weight:600}
.mt .ctr small{display:block;font-size:10.5px;color:rgba(195,206,220,.55);margin:1px 0}
.mt .ctr strong{display:block;font-size:17px;font-weight:700}
.cnt{position:absolute;left:10px;top:10px;height:28px;min-width:50px;padding:0 10px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--panel-3);color:var(--text-2)}
.cnt.part{background:linear-gradient(90deg,var(--green) 0 6px,var(--panel-3) 6px);padding-left:14px}
.cnt.full{background:var(--red);color:#fff}
.jpb{position:absolute;left:50%;top:10px;translate:-50% 0;height:28px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--gold);background:rgba(233,201,135,.1)}
.jpb svg{width:14px;height:14px}
.shield{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--panel-3);color:var(--mute)}
.shield svg{width:15px;height:15px}
.seat{position:absolute;translate:-50% -50%;display:grid;justify-items:center;gap:2px;width:84px}
.seat .nm{font-size:10.5px;font-weight:500;color:var(--text-2);max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .av{width:38px;height:38px;border-radius:50%;background:#1B3550;box-shadow:0 0 0 2px #0A1526;overflow:hidden;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff}
.seat .av img{width:100%;height:100%;display:block}
.seat .stk{margin-top:-8px;padding:1px 7px;border-radius:99px;background:#0A1526;font-size:10.5px;font-weight:600;position:relative}
.seat .mvp{position:absolute;top:10px;right:6px;font-size:8.5px;font-weight:700;color:#3A2A08;background:var(--gold);border-radius:3px;padding:1px 4px}
.seat.empty .av{background:transparent;box-shadow:none;border:1.5px dashed rgba(195,206,220,.25);color:rgba(195,206,220,.45);font-size:18px;font-weight:400}
.seat.empty .nm{visibility:hidden}
.s0{left:32%;top:33%}.s1{left:68%;top:33%}.s2{left:11%;top:59%}.s3{left:89%;top:59%}.s4{left:32%;top:86%}.s5{left:68%;top:86%}
/* list mode */
.tlist{display:grid;gap:8px}
.lr{display:grid;grid-template-columns:56px 1.2fr 1fr 1.3fr 1fr .8fr 120px;align-items:center;gap:14px;height:68px;padding:0 14px 0 12px;border-radius:var(--r);background:var(--panel);cursor:pointer;transition:background-color .2s var(--ease),transform .3s var(--ease)}
.lr:hover{background:var(--panel-2);transform:translateX(4px)}
.lr .btn{margin-bottom:3px}
.lr-felt{width:52px;height:34px;border-radius:999px;background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--felt-0),var(--felt-1) 55%,var(--felt-2));box-shadow:0 0 0 3px var(--rail),0 0 0 4px #0A1526}
.lr-nm{display:grid;line-height:1.25}.lr-nm b{font-weight:600;font-size:14.5px}.lr-nm small{color:var(--mute);font-size:12px}
.lr-bl{font-weight:700;font-size:15px}
.lr-pl{display:flex;align-items:center;gap:10px}
.lr-pl .cnt{position:static;height:26px;min-width:44px;font-size:12.5px}
.avs{display:flex}
.avs i{width:28px;height:28px;border-radius:50%;margin-left:-8px;display:grid;place-items:center;overflow:hidden;font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#1B3550;box-shadow:0 0 0 2px var(--panel)}
.avs i:first-child{margin-left:0}.avs img{width:100%;height:100%}
.lr .m{color:var(--mute)}
.lr .jp{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:600}.lr .jp svg{width:16px;height:16px}
.lr.f-blue{--felt-0:#1C5E8F;--felt-1:#124169;--felt-2:#0B2A47;--rail:#132C47}
.lr.f-green{--felt-0:#1F7A55;--felt-1:#145538;--felt-2:#0C3524;--rail:#12301F}
.lr.f-red{--felt-0:#8E2A34;--felt-1:#631C25;--felt-2:#3F1118;--rail:#33141A}

/* Spin & Go */
.sbox{padding:18px;border-radius:var(--r);background:var(--panel);display:grid;gap:16px}
.sbox .sec-h a{margin-left:auto;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.subtabs{display:flex;gap:2px;padding:3px;border-radius:var(--rs);background:var(--panel-2);width:max-content}
.subtabs button{height:36px;padding:0 14px;border-radius:6px;color:var(--mute);font-weight:600;font-size:13px}
.subtabs button.on{background:var(--panel-4);color:var(--text)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scard{position:relative;aspect-ratio:1.7/1;border-radius:var(--r);overflow:hidden;background:var(--panel-2);display:block}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,100% 50%)}
.scard::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tint) 34%,color-mix(in srgb,var(--tint) 55%,transparent) 58%,transparent 80%)}
.scard.t1{--tint:#0E2A4A}.scard.t2{--tint:#0B3A6E}.scard.t3{--tint:#2A2414}
.scard>*:not(img){position:absolute;z-index:1}
.scard .bi{left:14px;top:14px;padding:6px 9px;border-radius:6px;background:rgba(7,15,28,.6);line-height:1.2}
.scard .bi small{display:block;font-size:11px;color:var(--text-2)}
.scard .bi b{font-size:16px;font-weight:700}
.scard .win{left:14px;top:46%;line-height:1.05}
.scard .win small{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.scard .win b{font-size:28px;font-weight:700;color:var(--gold)}
.scard .ft{left:14px;bottom:12px;font-size:12.5px;color:var(--text-2);display:flex;gap:8px;align-items:center}

/* ── Motion (Cloudbet-style: ease-out, 150/300/500ms) ── */
:root{--ease:cubic-bezier(0,0,.2,1);--ease-io:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.175,.885,.32,1.275)}
.btn,.ibtn,.sq,.tabs button,.vt button,.subtabs button,.chk,.car-arrow,.dots i,.grp a,.tabbar a{transition:background-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease),box-shadow .3s var(--ease),filter .15s var(--ease),width .3s var(--ease-io)}
.btn:active,.ibtn:active,.sq:active,.tabs button:active,.car-arrow:active{transform:scale(.96)}
.btn-blue{position:relative;overflow:hidden;isolation:isolate}
.btn-blue:hover{box-shadow:0 6px 20px rgba(0,152,254,.35)}
.btn.play::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-100%)}25%,100%{transform:translateX(100%)}}
.grp a svg{transition:color .2s var(--ease),transform .3s var(--spring)}
.grp a:hover svg:not(.ch){transform:scale(1.12)}
.grp a .ch{transition:transform .3s var(--ease)}
.grp a:hover .ch{transform:translateX(3px)}

/* cards: lift + image zoom */
.tcard,.mt,.scard,.slide{transition:transform .3s var(--ease),background-color .3s var(--ease),box-shadow .3s var(--ease)}
.tcard:hover,.mt:hover,.scard:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.slide:hover{transform:translateY(-3px)}
.tart img,.scard img,.slide video{transition:transform .5s var(--ease)}
.tcard:hover .tart img,.scard:hover img,.slide:hover video{transform:scale(1.05)}
.mt .oval{transition:transform .5s var(--ease),filter .3s var(--ease)}
.mt:hover .oval{transform:scale(1.03);filter:brightness(1.12)}
.seat .av{transition:transform .3s var(--spring)}
.mt:hover .seat:not(.empty) .av{transform:scale(1.06)}
.seat.empty .av{transition:border-color .2s var(--ease),color .2s var(--ease),background-color .2s var(--ease)}
.mt:hover .seat.empty .av{border-color:rgba(0,152,254,.6);color:var(--blue);background:rgba(0,152,254,.08)}

/* reveal on scroll / view change */
.rv{opacity:0;transform:translateY(10px)}
.rv.in{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:var(--d,0ms)}
.tcard.rv.in,.mt.rv.in,.scard.rv.in,.slide.rv.in{transition:opacity .5s var(--ease) var(--d,0ms),transform .5s var(--ease) var(--d,0ms),background-color .3s var(--ease),box-shadow .3s var(--ease)}

/* sliding pill under tabs */
.tabs,.subtabs{position:relative}
.tabs .pill,.subtabs .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:6px;background:var(--panel-4);transition:transform .3s var(--ease-io),width .3s var(--ease-io);z-index:0;pointer-events:none}
.tabs button,.subtabs button{position:relative;z-index:1}
.tabs.has-pill button.on,.subtabs.has-pill button.on{background:transparent}

/* toast pops with spring */
.toast{transition:opacity .3s var(--ease),translate .3s var(--spring),scale .3s var(--spring);scale:.92}
.toast.on{scale:1}

/* numbers tick */
#jpv{transition:color .3s var(--ease)}
#jpv.tick{color:#FFE7A8}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1;transform:none}
}

/* ── Pill buttons (Cloudbet) ── */
.btn{border-radius:999px;padding:0 20px}
.hdr .btn{height:44px;padding:0 24px;font-size:14.5px}
.ibtn,.sq,.car-arrow{border-radius:50%}
.srch{border-radius:999px;padding-left:18px}
.srch .clr{border-radius:50%}
.tabs,.vt,.subtabs{border-radius:999px;padding:4px}
.tabs button,.vt button,.subtabs button,.tabs .pill,.subtabs .pill{border-radius:999px}
.tabs .pill,.subtabs .pill{top:4px;bottom:4px}
.chk{border-radius:999px}

/* sidebar footer */
.sfoot{margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-top:6px;min-width:0}
.appc{display:flex;align-items:center;gap:12px;padding:12px;min-width:0;border-radius:14px;background:var(--panel)}
.appc:hover{background:var(--panel-2)}
.appi{width:52px;height:52px;flex:none;border-radius:12px;background:linear-gradient(160deg,#1FA5FF,#0B6FD1);display:grid;place-items:center;color:#fff}
.appi svg{width:34px;height:auto}
.appt{display:grid;gap:2px;flex:1;min-width:0}
.appt b{font-size:14px;font-weight:700}
.appt small{font-size:12px;color:var(--mute);line-height:1.35}
.appc .ch{width:18px;height:18px;color:var(--mute);transition:transform .3s var(--ease)}
.appc:hover .ch{transform:translateX(3px)}
.srow{display:flex;gap:5px;min-width:0}
.sb{width:auto;height:38px;flex:1 1 0;min-width:0;border-radius:12px;display:grid;place-items:center;background:var(--panel);color:var(--text-2);transition:background-color .15s var(--ease),color .15s var(--ease)}
.sb:hover{background:var(--panel-3);color:#fff}
.sb svg{width:20px;height:20px}
.lang2{margin-left:auto;height:38px;padding:0 8px 0 7px;gap:6px;border-radius:12px;display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--text);font-weight:600;font-size:13.5px}
.lang2:hover{background:var(--panel-3)}
.lang2 svg{width:16px;height:16px;color:var(--mute)}
.flag{width:20px;height:20px;border-radius:50%;flex:none;background:
  linear-gradient(transparent 42%,#C8102E 42% 58%,transparent 58%),
  linear-gradient(90deg,transparent 42%,#C8102E 42% 58%,transparent 58%),
  linear-gradient(transparent 34%,#fff 34% 66%,transparent 66%),
  linear-gradient(90deg,transparent 34%,#fff 34% 66%,transparent 66%),
  #012169;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.sup{display:flex;align-items:center;gap:12px;padding:12px 0 2px;min-width:0;border-top:1px solid var(--line);font-weight:600;font-size:14.5px}
.supi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);color:#fff}
.supi svg{width:18px;height:18px}
.sup .lb{flex:1}
.b247{padding:4px 10px;border-radius:999px;background:var(--blue);color:#fff;font-size:12.5px;font-weight:700}
.sup:hover .supi{background:var(--panel-3)}

/* ── Flat buttons with flat bottom shadow ── */
.btn-blue{background:var(--blue);box-shadow:0 3px 0 #0A5FB0}
.btn-blue:hover{background:var(--blue-h);box-shadow:0 3px 0 #0A5FB0}
.btn-dark{background:var(--panel-3);box-shadow:0 3px 0 #070C16}
.btn-dark:hover{background:var(--panel-4);box-shadow:0 3px 0 #070C16}
.ibtn,.car-arrow{box-shadow:0 3px 0 #070C16}
.btn,.ibtn,.car-arrow{margin-bottom:3px}
.btn:active,.ibtn:active,.car-arrow:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.hdr .btn{margin-bottom:0}

/* header search: no box, just icon + text */
.hdr .srch{background:transparent;padding-left:0;box-shadow:none}
.hdr .srch:focus-within{box-shadow:none;color:var(--text)}
.hdr .srch input::placeholder{color:var(--mute)}

/* ── Skeletons ── */
.sk{position:relative;overflow:hidden;background:var(--panel);border-radius:var(--r)}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(120,160,230,.07) 45%,rgba(120,160,230,.11) 50%,rgba(120,160,230,.07) 55%,transparent);animation:skx 1.4s var(--ease-io) infinite}
@keyframes skx{to{transform:translateX(100%)}}
.sk.ln{height:14px;border-radius:999px}
.sk.pill{border-radius:999px}
.sk-row{display:flex;align-items:center;gap:12px}
.sk-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sk-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sk-mt{aspect-ratio:1.4/1;display:grid;place-items:center}
.sk-mt i{display:block;width:72%;height:58%;border-radius:999px;background:var(--panel-3);margin-top:8%}
.sk-tc{display:grid;grid-template-rows:auto auto}
.sk-tc .im{aspect-ratio:1.85/1;border-radius:0;background:var(--panel-2)}
.sk-tc .bd{padding:14px;display:grid;gap:10px}
.view.skel{animation:none}
.view.fadein{animation:vfade .35s var(--ease) both}
@keyframes vfade{from{opacity:0}}
@media (max-width:1280px){.sk-grid4{grid-template-columns:repeat(3,1fr)}.sk-grid4>:nth-child(n+4){display:none}.sk-grid3{grid-template-columns:repeat(2,1fr)}.sk-grid3>:nth-child(n+3){display:none}}
@media (max-width:860px){.sk-grid3,.sk-grid4{grid-template-columns:1fr}.sk-grid3>:nth-child(n+2),.sk-grid4>:nth-child(n+2){display:none}}

/* ══════════ Mobile lobby (BC Poker pattern) ══════════ */
.m-only{display:none}
@media (max-width:860px){
  .m-only{display:block}
  .d-only{display:none!important}
  .main{padding:10px 12px calc(96px + var(--safe-b))}
  .view{gap:12px}
  .view.mob{gap:0}
  .mob .car{margin-bottom:12px}
  .mob .slide{aspect-ratio:21/9;border-radius:12px}
  .mob .slide video{object-position:60% 30%}
  .mob .car{margin-bottom:8px}
  .mob .dots{margin:-2px 0 6px}
  .mob .dots i{width:5px;height:5px}.mob .dots i.on{width:26px}
  .mob .dots{margin:-4px 0 10px}
  /* underline mode tabs */
  .mtabs{position:sticky;top:var(--head);z-index:20;display:flex;gap:22px;margin:0 -12px;padding:0 14px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtabs a{position:relative;flex:none;height:46px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:14.5px;color:var(--mute);transition:color .2s var(--ease)}
  .mtabs a svg{width:18px;height:18px}
  .mtabs a .s{display:none}
  .mtabs a.on{color:var(--text)}
  .mtabs a.on .o{display:none}.mtabs a.on .s{display:block;color:var(--blue)}
  .mtabs a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue);transform:scaleX(0);transition:transform .3s var(--ease)}
  .mtabs a.on::after{transform:scaleX(1)}
  /* chips + filter row */
  .mfil{position:sticky;top:calc(var(--head) + 47px);z-index:19;display:flex;align-items:center;gap:8px;margin:0 -12px;padding:10px 12px;background:var(--bg)}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:32px;padding:0 13px;border-radius:999px;display:flex;align-items:center;gap:6px;background:var(--panel);color:var(--text-2);font-weight:600;font-size:12.5px;transition:background-color .15s var(--ease),color .15s var(--ease)}
  .chip.on{background:var(--blue);color:#fff}
  .chip .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--dim)}
  .chip.tg.on{background:rgba(0,152,254,.16);color:var(--text)}
  .chip.tg.on .dot{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 40%,transparent 46%)}
  .fbtn{flex:none;width:36px;height:32px;border-radius:999px;display:grid;place-items:center;background:var(--panel);color:var(--text-2)}
  .fbtn svg{width:18px;height:18px}
  .mlist{display:grid;gap:8px}
  .mhead{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 2px;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.02em}
  .mhead b{color:var(--text-2);font-weight:600}
  /* table row */
  .mrow{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;border-radius:14px;background:var(--panel);cursor:pointer;transition:background-color .15s var(--ease),transform .15s var(--ease)}
  .mrow:active{transform:scale(.985);background:var(--panel-2)}
  .mthumb{position:relative;width:88px;height:52px;flex:none;border-radius:999px;display:grid;place-items:center;
    background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--felt-0),var(--felt-1) 55%,var(--felt-2));
    box-shadow:0 0 0 4px var(--rail),0 0 0 5px #0A1526,inset 0 0 14px rgba(0,0,0,.35)}
  .mthumb b{padding:2px 9px;border-radius:999px;background:rgba(3,7,13,.55);font-size:13px;font-weight:700}
  .mthumb .sd{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22)}
  .mthumb .sd.f{background:#fff}
  .mthumb .p0{left:32%;top:-3px}.mthumb .p1{left:62%;top:-3px}.mthumb .p2{left:-3px;top:45%}.mthumb .p3{right:-3px;top:45%}.mthumb .p4{left:32%;bottom:-3px}.mthumb .p5{left:62%;bottom:-3px}
  .mrow.f-blue,.mtt.f-blue{--felt-0:#1C5E8F;--felt-1:#124169;--felt-2:#0B2A47;--rail:#132C47}
  .mrow.f-green{--felt-0:#1F7A55;--felt-1:#145538;--felt-2:#0C3524;--rail:#12301F}
  .mrow.f-red{--felt-0:#8E2A34;--felt-1:#631C25;--felt-2:#3F1118;--rail:#33141A}
  .minfo{flex:1;min-width:0;display:grid;gap:6px}
  .mt1{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
  .mt1 b{font-size:14.5px;font-weight:700}
  .mt1 span{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
  .mt2{display:flex;align-items:center;gap:6px}
  .tag{height:22px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;background:var(--panel-3);color:var(--text-2)}
  .tag.b{background:rgba(0,152,254,.16);color:#6CC4FF}
  .tag.g{background:rgba(233,201,135,.14);color:var(--gold)}
  .tag.r{background:rgba(47,203,122,.14);color:var(--green)}
  .tag.jp{margin-left:auto;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(233,201,135,.6);color:var(--gold)}
  /* tournament row */
  .mtt{display:flex;gap:12px;padding:10px;border-radius:14px;background:var(--panel);cursor:pointer}
  .mtt:active{transform:scale(.985)}
  .mart{position:relative;width:104px;height:96px;flex:none;border-radius:10px;overflow:hidden;background:#0C1F3A}
  .mart.gold{background:#2A2414}.mart.free{background:#0E2F2A}
  .mart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,center);opacity:.55}
  .mart .pp{position:absolute;left:0;right:0;top:12px;text-align:center;line-height:1.1}
  .mart .pp small{display:block;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .mart .pp b{font-size:19px;font-weight:700;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .mart .st{position:absolute;left:4px;right:4px;bottom:4px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(3,7,13,.78);font-size:10.5px;font-weight:600;color:var(--text-2)}
  .mart .st.live{color:var(--green)}
  .mtt .minfo{gap:7px;padding:2px 0}
  .mtt h4{margin:0;font-size:14.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mt3{display:flex;align-items:center;gap:14px;color:var(--text-2);font-size:12.5px;font-weight:600;margin-top:auto}
  .mt3 span{display:flex;align-items:center;gap:5px}
  .mt3 svg{width:15px;height:15px;color:var(--mute)}
  .mt3 .rg{margin-left:auto;height:28px;padding:0 12px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;box-shadow:0 2px 0 #0A5FB0}
  .mt3 .rg.done{background:rgba(47,203,122,.16);color:var(--green);box-shadow:none}
  /* spin grid */
  .mob .sgrid{grid-template-columns:1fr 1fr;gap:8px}
  /* bottom bar */
  .tabbar{grid-template-columns:1fr 1fr 1fr!important;align-items:end}
  .tabbar a{position:relative}
  .tabbar a.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
  .tabbar .qs{margin-top:-22px;justify-self:center;display:grid;justify-items:center;gap:4px;color:var(--text);font-size:10.5px;font-weight:700}
  .tabbar .qs i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--blue);box-shadow:0 4px 0 #0A5FB0,0 0 0 5px var(--panel);color:#fff}
  .tabbar .qs i svg{width:26px;height:26px}
  .tabbar .qs:active i{transform:translateY(3px);box-shadow:0 1px 0 #0A5FB0,0 0 0 5px var(--panel)}
}

@media (max-width:860px){
  /* header */
  .hdr{gap:8px}
  .hdr .play,.hdr .reg{display:none}
  .mbal{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 6px;border-radius:999px;background:var(--panel);font-weight:700;font-size:14px;margin-left:auto}
  .mbal .coin{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#4A3610;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700}
  .mbal svg{width:14px;height:14px;color:var(--mute)}
  .mava{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#1B3550;flex:none}
  .mava img{width:100%;height:100%;display:block}
  /* filter bar */
  .mfil{padding:8px 12px}
  .msel{position:relative}
  .msel-b{height:36px;min-width:112px;padding:0 10px 0 14px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);color:var(--text);font-weight:600;font-size:13.5px}
  .msel-b svg{width:16px;height:16px;color:var(--mute);transition:transform .25s var(--ease)}
  .msel.open .msel-b svg{transform:rotate(180deg)}
  .msel-m{position:absolute;left:0;top:calc(100% + 6px);min-width:170px;padding:6px;border-radius:12px;background:var(--panel-2);box-shadow:0 14px 40px rgba(0,0,0,.5);display:grid;gap:2px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s var(--ease),transform .25s var(--ease);z-index:30}
  .msel.open .msel-m{opacity:1;transform:none;pointer-events:auto}
  .msel-i{height:40px;padding:0 12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13.5px;color:var(--text-2)}
  .msel-i small{color:var(--mute);font-size:12px}
  .msel-i.on{background:var(--panel-4);color:var(--text)}
  .chip.tg{height:36px;border-radius:10px;padding:0 12px}
  .fbtn{height:36px;width:40px;border-radius:10px}
  .fbtn.on{background:var(--blue);color:#fff}
  /* rows */
  .mrow{padding:10px 12px 10px 10px;gap:14px}
  .mthumb{width:96px;height:56px;border-radius:999px;box-shadow:none;background:var(--rail);padding:5px}
  .mth-in{position:relative;width:100%;height:100%;border-radius:999px;display:grid;place-items:center;background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--felt-0),var(--felt-1) 55%,var(--felt-2));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18),inset 0 0 14px rgba(0,0,0,.35)}
  .mthumb b{padding:3px 11px;border-radius:999px;background:rgba(3,7,13,.6);font-size:14px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .mthumb .sd{width:6px;height:6px}
  .mthumb .p0{left:30%;top:1px}.mthumb .p1{left:62%;top:1px}.mthumb .p2{left:2px;top:44%}.mthumb .p3{right:2px;top:44%}.mthumb .p4{left:30%;bottom:1px}.mthumb .p5{left:62%;bottom:1px}
  .mt1 em{font-style:normal;color:var(--mute);font-size:12.5px}
  .tag.o{background:rgba(233,201,135,.14);color:var(--gold)}
  /* bottom bar */
  .tabbar{grid-template-columns:1fr 1fr auto 1fr 1fr!important;padding:4px 4px calc(6px + var(--safe-b))}
  .tabbar a{font-size:10px}
  .tabbar .qs{margin-top:-24px;padding:0 8px}
  .tabbar .qs i{width:54px;height:54px}
}

/* ══ Chat (desktop, pinned right) ══ */
:root{--chatw:360px}
.shell{grid-template-columns:var(--side) 1fr 0;transition:grid-template-columns .35s var(--ease-io)}
body.chat-open .shell{grid-template-columns:var(--side) 1fr var(--chatw)}
.chat{position:sticky;top:var(--head);height:calc(100vh - var(--head));display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg);border-left:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
body.chat-open .chat{opacity:1;pointer-events:auto}
.chat>*{min-width:var(--chatw)}
.chatbtn{margin-right:2px}
.ch-h{display:flex;align-items:center;gap:4px;height:60px;padding:0 10px 0 14px;border-bottom:1px solid var(--line)}
.ch-room{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 2px;font-weight:700;font-size:16px;color:var(--text)}
.ch-room svg{width:18px;height:18px;color:var(--mute)}
.ch-h .sq{width:36px;height:36px;background:var(--panel)}
.ch-list{flex:1;overflow-y:auto;padding:14px 14px 10px;display:grid;gap:14px;align-content:start;scrollbar-width:thin;scrollbar-color:var(--panel-3) transparent}
.msg{display:grid;grid-template-columns:40px 1fr;gap:10px;animation:msgin .3s var(--ease) both}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}}
.msg .av{width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:#1B3550}
.msg .av img{width:100%;height:100%;display:block}
.msg .av.bot{background:var(--blue);color:#fff}
.msg .av.bot svg{width:22px;height:auto}
.msg .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden}
.msg .who small{font-weight:500;color:var(--mute);font-size:12px}
.msg .who .lv{width:16px;height:16px;border-radius:5px;background:var(--gold);color:#4A3610;font-size:9.5px;display:grid;place-items:center;font-weight:800}
.msg .who .bt{padding:1px 6px;border-radius:5px;background:var(--panel-3);color:var(--text-2);font-size:10.5px;font-weight:600}
.msg .bubbles{display:grid;gap:4px;justify-items:start}
.bub{padding:8px 12px;border-radius:12px;background:var(--panel-2);font-size:13.5px;line-height:1.4;max-width:100%;word-break:break-word}
.msg.me .bub{background:rgba(0,152,254,.18)}
.card-msg{width:100%;padding:12px;border-radius:14px;background:var(--panel-2);display:grid;gap:10px}
.card-msg .t{font-size:13px;font-weight:700;color:var(--green)}
.card-msg .d{font-size:12.5px;color:var(--text-2)}
.card-msg .d b{color:var(--text)}
.card-msg .row{display:flex;align-items:center;gap:8px}
.card-msg .mini{width:64px;height:38px;border-radius:999px;margin-left:auto;background:radial-gradient(ellipse 70% 60% at 50% 45%,#1C5E8F,#124169 55%,#0B2A47);box-shadow:0 0 0 3px #132C47}
.card-msg .big{font-size:22px;font-weight:700;color:var(--gold);text-align:center;padding:6px;border-radius:10px;background:rgba(233,201,135,.08)}
.card-msg .cta{height:36px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 #0A5FB0}
.card-msg .cta.win{background:var(--green);color:#06120B;box-shadow:0 2px 0 #1E9A5A}
.ch-in{display:flex;align-items:center;gap:6px;padding:10px 12px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg)}
.ch-in .sq{width:38px;height:38px;background:var(--panel)}
.ch-in .send{background:var(--blue);color:#fff}
.ch-field{flex:1;min-width:0;display:flex;align-items:center;height:40px;padding:0 6px 0 14px;border-radius:12px;background:var(--panel)}
.ch-field input{all:unset;flex:1;min-width:0;font-size:13.5px;color:var(--text)}
.ch-field input::placeholder{color:var(--mute)}
.ch-field .emo{font-size:17px;line-height:1;padding:4px}
@media (max-width:1180px){ body.chat-open .shell{grid-template-columns:var(--side) 1fr 0} body.chat-open .chat{position:fixed;right:0;top:var(--head);width:var(--chatw);box-shadow:-20px 0 50px rgba(0,0,0,.5);z-index:45} }
@media (max-width:860px){ .chat,.chatbtn{display:none!important} body.chat-open .shell{display:block} }

/* chat open: tighter grids on mid screens */
@media (min-width:861px) and (max-width:1700px){
  body.chat-open .tables{grid-auto-columns:calc((100% - 14px) / 2)}
  body.chat-open .tables.grid,body.chat-open .sgrid{grid-template-columns:repeat(2,1fr)}
  body.chat-open .car-track{grid-auto-columns:calc(50% - 7px)}
  body.chat-open .tgrid{grid-template-columns:repeat(3,1fr)}
  body.chat-open .tgrid .tcard:nth-child(n+4){display:none}
  body.chat-open .main{padding-left:22px;padding-right:22px}
}
.chatbtn .badge{display:none}
.chatbtn.has .badge{display:grid}
.ch-h .ch-room{min-width:0}
.card-msg .d .tag{display:inline-flex;margin-top:6px}

/* ── Mode tiles ── */
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:6px}
.mode{position:relative;height:92px;border-radius:16px;display:flex;align-items:center;padding:0 0 0 16px;color:#fff;transition:transform .35s var(--ease);-webkit-tap-highlight-color:transparent;isolation:isolate}
.mbg{position:absolute;inset:0;border-radius:inherit;background:rgba(10,18,31,.5);box-shadow:inset 0 0 0 1.5px var(--line-2);transition:box-shadow .35s var(--ease);z-index:0;overflow:hidden}
.mbg::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--g1) 0%,color-mix(in srgb,var(--g2) 55%,transparent) 50%,transparent 100%);clip-path:polygon(100% 0,100% 0,0 100%,0 100%);transition:clip-path .55s cubic-bezier(.3,.6,.2,1)}
.mbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 120% at 80% 100%,rgba(255,255,255,.08),transparent 60%);opacity:0;transition:opacity .35s var(--ease)}
.mode .ml{position:relative;z-index:2;flex:none;max-width:50%;font-weight:800;font-style:italic;font-size:15px;letter-spacing:.01em;text-transform:uppercase;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .35s var(--ease)}
.mdart{position:absolute;right:0;top:-45%;bottom:0;width:56%;z-index:1;pointer-events:none;overflow:hidden;border-radius:0 16px 16px 0}
.mdart img{position:absolute;right:0;bottom:0;height:100%;width:100%;object-fit:contain;object-position:right bottom;transition:opacity .35s var(--ease),transform .5s var(--ease);will-change:transform}
.mdart .mi{height:50%;bottom:10%;right:12px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.mdart .mh{height:86%;bottom:0;right:0;opacity:0;transform:translateY(14px) scale(.92);transform-origin:80% 100%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.mode:hover,.mode:focus-visible{transform:translateY(-4px) scale(1.03);z-index:3}
.mode:hover .mbg,.mode:focus-visible .mbg{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18),0 18px 34px -12px color-mix(in srgb,var(--g2) 70%,transparent)}
.mode:hover .mbg::before,.mode:focus-visible .mbg::before{clip-path:polygon(0 0,200% 0,100% 100%,-100% 100%)}
.modes:hover .mode:not(:hover){opacity:.6}
.mode{transition:transform .35s var(--ease),opacity .35s var(--ease)}
.mode:hover .mbg::after{opacity:1}
.mode:hover .mh,.mode:focus-visible .mh{opacity:1;transform:translateY(0) scale(1)}
.mode:hover .mi,.mode:focus-visible .mi{opacity:0;transform:translateY(-12px) scale(.9)}
.mode:hover .ml{transform:translateX(2px)}
.mode:active{transform:translateY(-2px) scale(.98)}
.g-mtt{--g1:#2F8BFF;--g2:#1A5FE0;--g3:#0C3FA8}
.g-nlhe{--g1:#34D27E;--g2:#13A05A;--g3:#0A6A3C}
.g-spin{--g1:#9B6CFF;--g2:#6A3BD6;--g3:#3D1F8F}
.g-flash{--g1:#FF5FA8;--g2:#C72B8F;--g3:#7A1566}
.g-plo{--g1:#28C8D8;--g2:#1486B4;--g3:#0A4F78}
.g-short{--g1:#FFA23A;--g2:#E06A1C;--g3:#9A3A0C}
@media (max-width:1280px){.modes{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  .modes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 10px;padding:6px 12px 0}
  .modes::-webkit-scrollbar{display:none}
  .mode{flex:none;width:150px;height:70px;border-radius:12px;padding-left:12px}
  .mode .ml{font-size:12.5px}.mdart{width:52%;border-radius:0 12px 12px 0}
}

@media (max-width:860px){
  .mhome{gap:10px}
  .mhome .car{margin-bottom:0}
  .mhome .dots{margin:4px 0 2px}
  .mytour{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px;border-radius:12px;background:var(--panel);font-weight:600;font-size:14.5px;color:var(--text)}
  .mytour svg{width:18px;height:18px;color:var(--mute)}
  .modes.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0;padding:0;overflow:visible}
  .modes.big .mode{width:auto;height:76px;border-radius:14px}
  .modes.big .mode .ml{font-size:13.5px}
  .skel .sk-grid3>:nth-child(n+3){display:block}
}

/* ── Leaderboard ── */
.board{display:grid;gap:6px}
.br{display:grid;grid-template-columns:70px 1fr 120px 120px;align-items:center;gap:12px;height:56px;padding:0 18px;border-radius:12px;background:var(--panel)}
.br.h{height:40px;background:transparent;color:var(--mute);font-size:12.5px;font-weight:600}
.br .r{text-align:right}
.br .pl{display:flex;align-items:center;gap:12px;min-width:0}
.br .pl b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pav{position:relative;width:36px;height:36px;flex:none}
.pav img,.pav i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;background:#1B3550;object-fit:cover}
.pav .fl{position:absolute;right:-4px;bottom:-3px;width:16px;height:11px;box-shadow:0 0 0 2px var(--panel)}
.md{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#2A1B06}
.md.m0{background:linear-gradient(160deg,#FFE9A8,#D9A93F)}.md.m1{background:linear-gradient(160deg,#E8EEF5,#9AA6B4)}.md.m2{background:linear-gradient(160deg,#E5A977,#A5602F)}
.rk{color:var(--text-2);font-weight:600;padding-left:8px}
.rw{color:var(--green);font-weight:700}
.br.me{position:relative;background:transparent;box-shadow:inset 0 0 0 1.5px var(--green);margin-top:4px;height:72px;padding-bottom:16px}
.br.me .g{color:var(--green);font-weight:700}
.br.me .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--mute)}
.br.me .hint b{color:var(--green)}
.vip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vipc{padding:18px;border-radius:14px;background:var(--panel);display:grid;gap:2px;box-shadow:inset 0 3px 0 var(--vc)}
.vipc .vt{font-size:12.5px;font-weight:700;color:var(--vc);text-transform:uppercase;letter-spacing:.04em}
.vipc b{font-size:26px;font-weight:700}
.vipc small{color:var(--mute);font-size:12px}
@media (max-width:860px){
  .br{grid-template-columns:44px 1fr 64px 70px;gap:8px;padding:0 12px;height:52px}
  .br.h{display:none}
  .pav{width:32px;height:32px}.pav img,.pav i{width:32px;height:32px}
  .br.me{height:68px}
  .vip{grid-template-columns:1fr 1fr}
}

/* ── Podium ── */
.podium{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:16px;padding:20px 4% 0}
.podium::before{content:"";position:absolute;z-index:-1;left:50%;top:42%;width:1400px;height:1400px;margin:-700px 0 0 -700px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(0,152,254,.08) 0deg 6deg,transparent 6deg 15deg);
  -webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 18%,transparent 42%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 18%,transparent 42%);
  animation:rays 60s linear infinite}
.podium::after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(ellipse 40% 50% at 50% 40%,rgba(0,152,254,.14),transparent 70%)}
@keyframes rays{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.podium::before{animation:none}}
.pd{display:grid;justify-items:center;gap:0}
.pdu{display:grid;justify-items:center;gap:12px;margin-bottom:22px;position:relative}
.pdu::before{content:"";position:absolute;left:50%;top:40%;width:220px;height:220px;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(0,152,254,.22),transparent 65%);pointer-events:none}
.pdav{position:relative;width:96px;height:96px}
.pdav img,.pdav i{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:26px;color:#fff;background:#1B3550;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 16px 36px rgba(0,0,0,.55)}
.pd.p0 .pdav,.pd.p0 .pdav img,.pd.p0 .pdav i{width:112px;height:112px}
.pdn{position:relative;font-size:20px;font-weight:700}
.pd.p0 .pdn{font-size:24px}
.pdb{position:relative;width:100%;display:grid;justify-items:center;gap:6px;padding:26px 16px 22px;border-radius:0 0 16px 16px;background:linear-gradient(180deg,#182544 0%,#121C33 55%,#0E1628 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 -8px 20px rgba(0,0,0,.35),0 24px 40px -18px rgba(0,0,0,.7)}
.pdb::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px;background:linear-gradient(90deg,#2A3B63,#36497A 50%,#2A3B63);clip-path:polygon(0 100%,100% 100%,calc(100% - 12px) 0,12px 0);filter:none}
.pdb::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.pd.p0 .pdb{padding-top:30px;padding-bottom:28px;background:linear-gradient(180deg,#1F2F57 0%,#172448 55%,#111B38 100%)}.pd.p0 .pdb::before{background:linear-gradient(90deg,#334876,#45609C 50%,#334876)}
.pdt{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#fff}
.pdt svg{width:20px;height:20px}
.pdt.tg{background:#D9A93F;color:#2A1B06}.pdt.ts{background:#B9C3CF;color:#1A222C}.pdt.tb{background:#C77B3B;color:#2A1606}
.pdp{font-size:14px;color:var(--text-2);font-weight:600}
.pdl{width:100%;height:1px;background:rgba(255,255,255,.08);margin:8px 0 10px}
.pdz{display:inline-flex;align-items:center;gap:8px;font-size:26px;font-weight:700}
.pd.p0 .pdz{font-size:30px}
.pdz .coin{width:22px;height:22px;border-radius:50%;background:var(--gold);color:#4A3610;font-size:12px;display:grid;place-items:center;font-style:normal;font-weight:700}
.pdb small{color:var(--mute);font-size:13px}
.pdc{display:grid;justify-items:center;gap:2px;margin-top:22px;padding-top:18px;width:100%;border-top:1px solid rgba(255,255,255,.08)}
.pdc svg{width:28px;height:28px;color:var(--blue);margin-bottom:4px}
.pdc small{color:var(--mute);font-size:12.5px}
.pdc b{font-size:15px;font-weight:700}
.youline{margin:0 auto 6px;padding:12px 20px;border-radius:999px;background:var(--panel);color:var(--mute);font-size:13.5px;text-align:center;width:max-content;max-width:100%}
.youline b{color:var(--text)}
@media (max-width:860px){
  .podium{gap:6px;padding:14px 0 0;align-items:end;margin-bottom:10px}
  .pd{align-self:end}
  .pdu{gap:8px;margin-bottom:14px}.pdu::before{width:130px;height:130px}
  .pdav,.pdav img,.pdav i{width:58px;height:58px;border-radius:50%;font-size:18px}
  .pd.p0 .pdav,.pd.p0 .pdav img,.pd.p0 .pdav i{width:70px;height:70px}
  .pdn{font-size:12px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pd.p0 .pdn{font-size:13.5px}
  .podium::before{width:800px;height:800px;margin:-400px 0 0 -400px}
  .pdb{padding:16px 6px 14px;gap:3px;border-radius:0 0 12px 12px}.pd.p0 .pdb{padding-top:20px}
  .pdb::before{top:-9px;height:9px;clip-path:polygon(0 100%,100% 100%,calc(100% - 9px) 0,9px 0)}
  .pdt{width:32px;height:32px;border-radius:9px}.pdt svg{width:15px;height:15px}
  .pdp{font-size:10.5px;white-space:nowrap}.pdl{margin:6px 0 8px}
  .pdz{font-size:17px;gap:5px}.pd.p0 .pdz{font-size:21px}.pdz .coin{width:16px;height:16px;font-size:9px}
  .pdb small{font-size:11px}
  .pdc{margin-top:10px;padding-top:10px}.pdc svg{width:20px;height:20px;margin-bottom:2px}.pdc small{font-size:10.5px}.pdc b{font-size:11px;white-space:nowrap}
  .youline{font-size:11.5px;padding:10px 12px;width:auto;margin:0 0 10px;border-radius:12px}
  .mboard{gap:0}
  .mboard .mfil{margin-bottom:4px}
}
.rk{display:inline-flex;align-items:center;gap:8px}.rk svg{width:16px;height:16px;color:var(--blue)}
@media (max-width:860px){
}

/* ── Career ── */
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;grid-template-rows:auto auto;gap:14px}
.cprof{grid-row:span 2;align-items:center;text-align:center;justify-items:center;gap:6px;padding-top:28px}
.ctile{display:grid;align-content:start;gap:14px;padding:18px 20px;border-radius:14px;background:var(--panel);color:var(--text);transition:background-color .2s var(--ease),transform .2s var(--ease)}
a.ctile:hover{background:var(--panel-2);transform:translateY(-2px)}
.ct-h{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.ct-h svg{width:16px;height:16px;color:var(--mute)}
.ct-i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--panel-4);color:var(--text-2);font-size:10px;font-style:normal;font-weight:800;margin-left:4px;vertical-align:middle}
.ctile>b{font-size:30px;font-weight:700;line-height:1;margin-top:6px}
.ctile>small{color:var(--mute);font-size:14px;margin-top:-4px}
.cav{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#1B3550;box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--blue-soft)}
.cav img{width:100%;height:100%;display:block}
.cprof>b{font-size:17px;font-weight:700;margin-top:8px}
.cprof>small{color:var(--mute);font-size:12.5px;margin-top:-4px}
.cpass{width:100%;display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.cpass b{color:var(--text)}
.cpass i{display:block;height:6px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.cpass u{display:block;height:100%;background:var(--blue)}
.crow{gap:12px}
.crange{display:flex;align-items:center;gap:16px;height:52px;padding:0 18px;border-radius:12px;background:var(--panel);font-weight:600;font-size:14px}
.crange svg{width:18px;height:18px;color:var(--mute)}
.crow .tabs button b{font-weight:800}
.cempty{display:grid;justify-items:center;gap:8px;padding:70px 20px 60px;text-align:center}
.cempty svg{width:48px;height:48px;color:var(--mute);margin-bottom:8px}
.cempty b{font-size:16px}
.cempty small{color:var(--mute);font-size:13.5px;max-width:320px}
.cempty .btn{margin-top:10px}
.cempty.sm{padding:34px 20px 30px;border-radius:16px;background:var(--panel)}
@media (max-width:1280px){.cgrid{grid-template-columns:1fr 1fr 1fr}.cprof{grid-row:span 1;grid-column:span 3;padding:22px}.cprof .cav{width:72px;height:72px}}
@media (max-width:860px){
  .cgrid{grid-template-columns:1fr 1fr;gap:8px}
  .cprof{grid-column:span 2}
  .ctile{padding:14px;gap:10px;border-radius:12px}
  .ct-h{font-size:13.5px;padding-bottom:10px}
  .ctile>b{font-size:24px}.ctile>small{font-size:12.5px}
  .crow{gap:8px}
  .crange{height:44px;padding:0 12px;font-size:12.5px;gap:8px;width:100%;justify-content:center}
  .crow .tabs{width:100%}.crow .tabs button{flex:1;padding:0;font-size:12.5px}
  .crow .ibtn{display:none}
  .cempty{padding:40px 10px 30px}
}

/* ── Bonuses ── */
.bontop{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.vlh .vlc.on{background:linear-gradient(180deg,color-mix(in srgb,var(--vc) 28%,transparent),transparent);color:var(--text)}
.vlr .g{color:var(--green);font-weight:700}
.vlr .ok{width:18px;height:18px;color:var(--green)}
.tabs.per button{padding:0 18px}
@media (max-width:1280px){.vipperks{grid-template-columns:1fr}.vipgrid{grid-template-columns:1fr}}
@media (max-width:860px){
  .vhow{font-size:12.5px}
  .viphero{gap:16px;padding:18px}.vgem svg{width:92px;height:92px}
  .vinfo>b{font-size:24px}.vvp{font-size:13px}.vinfo small{font-size:12.5px}
  .vipcycle{padding:18px}.vch{font-size:17px}
  .vcs{grid-template-columns:1fr;gap:10px}.vci+.vci{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}
  .vico{width:44px;height:44px}.vico svg{width:20px;height:20px}.vci b{font-size:22px}
  .vipb{grid-template-columns:84px 1fr;padding:16px;gap:4px 14px}.vipart{width:84px;height:84px}.vipart svg{width:40px;height:40px}
  .vipt b{font-size:26px}.vipt small{font-size:13px}.vipb p{font-size:12.5px}
  .viplv{overflow-x:auto}.vlh,.vlr{grid-template-columns:120px repeat(6,110px)}.vlh>span,.vlr>span{padding:12px 10px;font-size:12.5px}
  .mvip .sec-h h2{font-size:17px}
  .tabs.per{width:100%;margin-bottom:6px}.tabs.per button{flex:1;padding:0}
}

/* Drawer + tabbar (phones) */
.tabbar,.drawer-bg{display:none}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));translate:-50% 20px;opacity:0;pointer-events:none;padding:11px 16px;border-radius:var(--rs);background:var(--panel-4);font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .25s,translate .25s;z-index:80}
.toast.on{opacity:1;translate:-50% 0}

@media (max-width:1280px){
  .car-track{grid-auto-columns:calc(50% - 7px)}
  .tgrid{grid-template-columns:repeat(3,1fr)}
  .tgrid .tcard:nth-child(n+4){display:none}
  .tables{grid-auto-columns:calc((100% - 14px) / 2)}
  .tables.grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:980px){ .hdr .reg{display:none} }

  :root{--head:calc(56px + var(--safe-t) + var(--tg-t))}

  .brandcell{width:auto}
  .hdr .srch{display:none}
  .sq{width:36px;height:36px}
  .logo{margin:0 2px}
  .logo img{height:17px}
  .user img{width:32px;height:32px}
  .bal{height:36px;gap:6px;padding:0 3px 0 8px}
  .bal b{min-width:0;font-size:13px}
  .bal .chev{display:none}
  .coin{width:16px;height:16px;font-size:9px}
  .plus{width:28px;height:28px}
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;width:272px;height:auto;translate:-100% 0;transition:translate .25s ease;padding-top:calc(14px + var(--safe-t) + var(--tg-t))}
  body.drawer .side{translate:0 0}
  .drawer-bg{display:block;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  body.drawer .drawer-bg{opacity:1;pointer-events:auto}
  .main{padding:14px 12px calc(90px + var(--safe-b))}
  .view{gap:18px}
  .welcome h1{font-size:18px}
  .ev{display:none}
  .car-track{grid-auto-columns:100%}
  .car-arrow{display:none}
  .tgrid{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .tgrid::-webkit-scrollbar{display:none}
  .tgrid .tcard{scroll-snap-align:center}
  .tgrid .tcard:nth-child(n+4){display:flex}
  .tgrid.all{grid-auto-flow:row;grid-template-columns:1fr;grid-auto-columns:auto;overflow:visible;margin:0;padding:0}
  .sec-h h2{font-size:16px}
  .jstrip{height:84px;padding:0 16px}
  .jstrip img{right:4px;bottom:-48%;height:160%}
  .jstrip .t small{font-size:11.5px}
  .jstrip .t b{font-size:22px}
  .frow{gap:8px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:0;height:36px;font-size:13px}
  .chk{height:40px;padding:0 12px;font-size:12.5px;flex:1}
  .vt{display:none}
  .chk .lg,.stake-h .meta .bl{display:none}
  .notice{height:40px;font-size:12px;justify-content:flex-start}
  .stake-h h3{font-size:16px}
  .stake-h .meta{order:3;width:100%;font-size:12.5px}
  .stake-h .sp{display:none}
  .stake-h .nav{margin-left:auto}
  .stake-h .nav .ibtn:not(.rf){display:none}
  .stake-h .va{display:none}
  .tables{grid-auto-columns:88%;margin:0 -12px;padding:0 12px}
  .tables.grid{grid-template-columns:1fr;margin:0;padding:0}
  .seat{width:70px}
  .seat .av{width:34px;height:34px}
  .lr{grid-template-columns:72px 1fr 1fr 96px;height:auto;padding:12px}
  .lr .h1,.lr .h2{display:none}
  .sbox{padding:12px}
  .sgrid{grid-template-columns:1fr 1fr;gap:10px}
  .scard{aspect-ratio:1/1.05}
  .scard::after{background:linear-gradient(0deg,var(--tint) 40%,color-mix(in srgb,var(--tint) 55%,transparent) 62%,transparent 85%)}
  .scard img{object-position:70% 0}
  .scard .win{top:auto;bottom:36px}
  .scard .win small{font-size:11px}
  .scard .win b{font-size:21px}
  .scard .bi b{font-size:14px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;padding:6px 6px calc(6px + var(--safe-b));background:var(--panel);border-top:1px solid var(--line)}
  .tabbar a{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:10.5px;font-weight:600}
  .tabbar a.on{color:var(--blue)}
}
@media (max-width:380px){ .user img{display:none} }

    if ((t = e.target.closest('[data-mtoggle]'))) { mstate[t.dataset.mtoggle] = !mstate[t.dataset.mtoggle]; haptic(); route(); if (t.dataset.mtoggle==='mine') toast(mstate.mine ? 'Empty tables hidden' : 'Showing all tables'); return; }
    if ((t = e.target.closest('[data-mtk]'))) { mstate.tkind = t.dataset.mtk; haptic(); route(); return; }
    if ((t = e.target.closest('[data-mreg]'))) { e.stopPropagation(); var tr = TOURS[+t.dataset.mreg], rg = {}; try { rg = JSON.parse(localStorage.getItem('12bet-reg') || '{}'); } catch(_){} rg[tr.name] = !rg[tr.name]; try { localStorage.setItem('12bet-reg', JSON.stringify(rg)); } catch(_){} haptic('medium'); route(); toast(rg[tr.name] ? 'Registered for ' + tr.name : 'Registration cancelled'); return; }
    if ((t = e.target.closest('.mrow[data-join]'))) { haptic('medium'); location.href = 'play.html'; return; }
    if ((t = e.target.closest('[data-bb]'))) { e.preventDefault(); bstate.bb = t.dataset.bb; haptic(); route(); return; }
    if ((t = e.target.closest('[data-bday]'))) { bstate.day = (bstate.day + 1) % 7; haptic(); route(); return; }
    if ((t = e.target.closest('[data-crange]'))) { cstate.range = +t.dataset.crange; haptic(); route(); return; }
    if ((t = e.target.closest('[data-cal]'))) { var k = ymd(new Date()); if (!BON_CLAIMED[k]) { BON_CLAIMED[k] = 1; try { localStorage.setItem('12bet-bclaim', JSON.stringify(BON_CLAIMED)); } catch(x){} toast('+$0.50 added to your balance'); haptic(); route(); } return; }
    if ((t = e.target.closest('[data-copy]'))) { copyText(t.dataset.copy); return; }
    if ((t = e.target.closest('[data-ctab]'))) { clstate.tab = t.dataset.ctab; haptic(); route(); return; }
    if ((t = e.target.closest('[data-per]'))) { bstate.per = t.dataset.per; haptic(); route(); return; }
    if ((t = e.target.closest('[data-hmode]'))) { state.hmode = t.dataset.hmode; try { localStorage.setItem('12bet-hmode', state.hmode); } catch(_){} haptic(); var y = scrollY; route(); window.scrollTo(0, y); return; }
    if ((t = e.target.closest('.lr[data-join]')) && !e.target.closest('a')) { haptic('medium'); location.href = 'play.html'; return; }
    if ((t = e.target.closest('[data-mode]'))) { state.mode = t.dataset.mode === 'list' ? 'list' : 'carousel'; haptic(); route(); return; }
    if ((t = e.target.closest('[data-viewall]'))) { e.preventDefault(); state.mode = state.mode === 'grid' ? 'carousel' : 'grid'; haptic(); route(); return; }
    if ((t = e.target.closest('[data-scroll]'))) { var tr = $('.tables[data-lv="' + t.dataset.lv + '"]', main); if (tr) tr.scrollBy({left: +t.dataset.scroll * (tr.clientWidth * .66), behavior:'smooth'}); return; }
    if ((t = e.target.closest('[data-refresh]'))) {
      var k = t.dataset.refresh; TABLES[k].forEach(function(x){ x.seats = makeSeats(x.bb); });
      var sec = $('#lv-' + k, main); if (sec) sec.outerHTML = levelBlock(LEVELS.find(function(L){ return L.k === k; }));
      var ns = $('#lv-' + k, main); if (ns) reveal(ns.parentNode);
      haptic(); toast('Tables updated'); return;
    }
    if ((t = e.target.closest('[data-st]'))) { state.spinTab = t.dataset.st; haptic(); route(); return; }
    if ((t = e.target.closest('[data-tour]'))) { e.preventDefault(); haptic(); var x = TOURS[+t.dataset.tour]; toast('Registered for ' + x.name); return; }
  });
  var qEl = document.getElementById('q'), qT;
  var srchF = document.getElementById('srchf');
  function applyQ(){ state.q = qEl.value; srchF.classList.toggle('has', !!qEl.value); if ((location.hash||'#home') !== '#holdem') location.hash = '#holdem'; else route(); qEl.focus(); }
  qEl.addEventListener('input', function(){ clearTimeout(qT); qT = setTimeout(applyQ, 180); });
  srchF.addEventListener('submit', function(e){ e.preventDefault(); clearTimeout(qT); applyQ(); });
  document.getElementById('qclr').addEventListener('click', function(){ qEl.value = ''; applyQ(); });
  document.addEventListener('change', function(e){
    if (e.target.id === 'hf') { state.hideFull = e.target.checked; route(); }
    if (e.target.id === 'he') { state.hideEmpty = e.target.checked; route(); }
  });
  document.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('mt')) { e.preventDefault(); location.href = 'play.html'; } });

  /* ══ Chat ══ */
  var chatOpen = (function(){ try { return localStorage.getItem('12bet-chat') === 'on'; } catch(e){ return false; } })();
  var chList = document.getElementById('chlist');
  var CHAT_COLORS = ['#2F6FD6','#0B8F7A','#B4553A','#6A4FC9','#A3307A','#C08A2B','#2B8FB8'];
  var CHAT_LINES = ['gg','nice hand','anyone on $0.25/$0.5?','that river tho','lol','flopped a set, finally','run it twice next time','who is up for a sit and go?','brb coffee','gl all','sick call','ty bot','sunday main anyone?','that was a bluff 100%','new table opened, join'];
  function tnow(){ var d=new Date(); return 'Today ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
  function avatarHtml(s){ return s.img ? '<span class="av"><img src="' + s.img + '" alt=""/></span>' : '<span class="av" style="background:' + s.col + '">' + esc(s.nm.slice(0,2).toUpperCase()) + '</span>'; }
  function msgText(s, lines, me){
    return '<div class="msg' + (me ? ' me' : '') + '">' + avatarHtml(s) + '<div><div class="who">' + esc(s.nm) + (s.lv ? '<span class="lv">' + s.lv + '</span>' : '') + '<small>' + tnow() + '</small></div><div class="bubbles">' + lines.map(function(l){ return '<span class="bub">' + esc(l) + '</span>'; }).join('') + '</div></div></div>';
  }
  function msgInvite(s, tb){
    var f = tb.seats.filter(Boolean).length;
    return '<div class="msg">' + avatarHtml(s) + '<div><div class="who">' + esc(s.nm) + '<span class="lv">' + (s.lv || 3) + '</span><small>' + tnow() + '</small></div>' +
      '<div class="card-msg"><div class="t">Let\'s get rich</div><div class="row"><div class="d"><b class="num">' + usd(tb.sb) + '/' + usd(tb.bb) + '</b> NLHE ' + tb.id + '<br><span class="tag b" style="margin-top:6px">NLH</span> <span class="num">' + f + '/6</span></div><span class="mini"></span></div><a class="cta" href="play.html" data-join>Play now</a></div></div></div>';
  }
  function msgWin(nm, tb, amt){
    return '<div class="msg"><span class="av bot"><svg viewBox="0 0 276 100"><use href="#mark12x"/></svg></span><div><div class="who">12xBet<span class="bt">Bot</span><small>' + tnow() + '</small></div>' +
      '<div class="card-msg"><div class="t">Incredible!</div><div class="d"><b>' + esc(nm) + '</b> won a big pot at <span class="num">' + usd(tb.sb) + '/' + usd(tb.bb) + ' NLHE ' + tb.id + '</span></div><div class="big num">$' + fmt(amt, 2) + '</div><a class="cta win" href="#holdem">Show more</a></div></div></div>';
  }
  function randPlayer(){ var i = Math.floor(Math.random()*NICKS.length); return { nm: NICKS[i], img: Math.random() > .5 ? AVA[i % AVA.length] : null, col: CHAT_COLORS[i % CHAT_COLORS.length], lv: 1 + Math.floor(Math.random()*9) }; }
  function randTable(){ var all = [].concat(TABLES.micro, TABLES.low, TABLES.mid, TABLES.high); return all[Math.floor(Math.random()*all.length)]; }
  function pushMsg(html){
    if (!chList) return;
    var atBottom = chList.scrollHeight - chList.scrollTop - chList.clientHeight < 80;
    chList.insertAdjacentHTML('beforeend', html);
    while (chList.children.length > 60) chList.removeChild(chList.firstChild);
    if (atBottom) chList.scrollTop = chList.scrollHeight;
    if (!document.body.classList.contains('chat-open')) { var b = document.getElementById('chatbadge'); if (b) { b.textContent = Math.min(99, (+b.textContent || 0) + 1); b.parentNode.classList.add('has'); } }
  }
  function seedChat(){
    if (!chList) return;
    chList.innerHTML = '';
    pushMsg(msgInvite(randPlayer(), randTable()));
    pushMsg(msgWin(NICKS[Math.floor(Math.random()*NICKS.length)], randTable(), 60 + Math.random()*240));
    pushMsg(msgText(randPlayer(), ['hi', 'anyone up for a game?']));
    pushMsg(msgText(randPlayer(), [CHAT_LINES[Math.floor(Math.random()*CHAT_LINES.length)]]));
    chList.scrollTop = chList.scrollHeight;
  }
  function setChat(open){
    chatOpen = open; document.body.classList.toggle('chat-open', open);
    try { localStorage.setItem('12bet-chat', open ? 'on' : 'off'); } catch(e){}
    if (open) { var b = document.getElementById('chatbadge'); if (b) { b.textContent = '0'; b.parentNode.classList.remove('has'); } setTimeout(function(){ if (chList) chList.scrollTop = chList.scrollHeight; }, 380); }
  }
  if (chList) {
    seedChat(); setChat(chatOpen && !isM());
    document.getElementById('chatbtn').addEventListener('click', function(){ setChat(!chatOpen); haptic(); });
    document.getElementById('chatclose').addEventListener('click', function(){ setChat(false); haptic(); });
    document.getElementById('chform').addEventListener('submit', function(e){
      e.preventDefault(); var inp = document.getElementById('chinput'); var v = inp.value.trim(); if (!v) return;
      pushMsg(msgText({nm:'You', col:'#0B6FD1', lv:3}, [v], true)); inp.value = ''; chList.scrollTop = chList.scrollHeight; haptic('medium');
    });
    setInterval(function(){
      if (document.hidden) return;
      var r = Math.random();
      if (r < .12) pushMsg(msgInvite(randPlayer(), randTable()));
      else if (r < .2) pushMsg(msgWin(NICKS[Math.floor(Math.random()*NICKS.length)], randTable(), 40 + Math.random()*400));
      else pushMsg(msgText(randPlayer(), [CHAT_LINES[Math.floor(Math.random()*CHAT_LINES.length)]]));
    }, 9000 + Math.random()*4000);
  }

  navigate();
})();
</script>
</body>
</html>
